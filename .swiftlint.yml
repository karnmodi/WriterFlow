disabled_rules:
  - trailing_whitespace
  - todo
  - line_length

opt_in_rules:
  - closure_end_indentation
  - closure_spacing
  - empty_count
  - explicit_init
  - first_where
  - operator_usage_whitespace
  - redundant_nil_coalescing
  - sorted_imports
  - toggle_bool
  - unneeded_parentheses_in_closure_argument

excluded:
  - .build
  - .swiftpm
  - Tests
  - build
  - vendor
  - spikes

identifier_name:
  min_length: 2
  max_length: 60
  excluded:
    - id
    - ax
    - ok

type_name:
  min_length: 3
  max_length: 60

file_length:
  warning: 500
  error: 800

function_body_length:
  warning: 60
  error: 120

cyclomatic_complexity:
  warning: 12
  error: 20
