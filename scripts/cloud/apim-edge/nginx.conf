worker_processes 1;
events { worker_connections 1024; }
http {
  server {
    listen 8080;
    server_name _;
    location / {
      proxy_pass https://${APIM_GATEWAY_HOST};
      proxy_ssl_server_name on;
      proxy_set_header Host ${APIM_GATEWAY_HOST};
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_read_timeout 300s;
    }
  }
}
