services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: writerflow
      POSTGRES_USER: writerflow_migrator
      POSTGRES_PASSWORD: writerflow_migrator_dev_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - writerflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U writerflow_migrator -d writerflow"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  writerflow_postgres_data:
